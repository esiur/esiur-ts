<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esiur Browser Client Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
      }

      h1 {
        font-size: 22px;
        margin: 0 0 16px;
      }

      #status {
        font-weight: 700;
        margin-bottom: 16px;
      }

      #log {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 6px;
        min-height: 320px;
        padding: 12px;
        background: color-mix(in srgb, CanvasText 4%, Canvas);
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      .pass {
        color: #137333;
      }

      .fail {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esiur Browser Client Test</h1>
      <div id="status">Starting...</div>
      <pre id="log"></pre>
    </main>
    <script src="config.js"></script>
    <script type="module" src="client.js"></script>
  </body>
</html>
